# talon bundle layer: composed on top of @deepseek-ai/dsh-base by the dsh
# profile loader (dsh.profile.bundles, appended after dsh-base by `dsh plugin
# ... add`). Row ids are loader labels (distinct from ctx service keys); row
# names are plugin module specifiers, resolved the same way an `import`
# would resolve them from the profile's node_modules — subpath names (e.g.
# 'talon-ui/boot') work exactly like '@deepseek-ai/dsh-tui/prompt' did for
# the old TUI, since both are ordinary package `exports` entries.
#
# session-projection-cache is not part of dsh-base (verified: absent from
# packages/bundle/base/cordis.patch.yml, present only in the web-app bundle)
# so talon inserts it itself for the cheap session-title ladder (spec §3.6).
# Its Config schema has no defaults (both fields z.natural().required()), so
# the row must state them explicitly; values mirror the web-app bundle's own
# tuned row (packages/bundle/web-app/cordis.patch.yml).
- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: talon-boot
      name: 'talon-ui/boot'

    - id: talon
      name: 'talon-ui'
